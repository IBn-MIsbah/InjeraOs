services:
  db:
    image: postgres:16-alpine
    container_name: injera_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-injera_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-injera_secure_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-injera_prod}
    volumes:
      - injera_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-injera_user} -d ${POSTGRES_DB:-injera_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - injera_network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: injera_app
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-injera_user}:${POSTGRES_PASSWORD:-injera_secure_pass_2026}@db:5432/${POSTGRES_DB:-injera_prod}?schema=public
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:3000}
      JWT_SECRET: ${JWT_SECRET:-generate_a_very_long_random_jwt_secret_in_prod_min_32_chars}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-generate_a_very_long_random_refresh_secret_in_prod_min_32_chars}
      RUN_MIGRATIONS: "true"
      SEED_SUPERADMIN: ${SEED_SUPERADMIN:-false}
      SUPERADMIN_NAME: ${SUPERADMIN_NAME:-Super Admin}
      SUPERADMIN_EMAIL: ${SUPERADMIN_EMAIL:-admin@bakery.et}
      SUPERADMIN_PHONE: ${SUPERADMIN_PHONE:-+251911000000}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD:-ChangeMeSecurely2026!}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - injera_network

volumes:
  injera_pgdata:
    name: injera_pgdata

networks:
  injera_network:
    name: injera_network
    driver: bridge
